<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MB Music</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif, system-ui;
            background-color: #210033;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.7s;
        }

        .video-bg.active { opacity: 1; }

        .video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
            pointer-events: none;
        }

        .page {
            display: none;
            min-height: 100vh;
            position: relative;
            z-index: 2;
        }

        .page.active { display: block; }

        /* Login Styles */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .login-box {
            background: linear-gradient(135deg, #2e004d, #1a002c);
            border-radius: 2rem;
            padding: 3rem;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            color: #8b5cf6;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #b3b3b3;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #380056;
            border-radius: 0.5rem;
            background-color: #1a002c;
            color: #e0e0e0;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        .message {
            padding: 0.8rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
            font-size: 0.9rem;
        }

        .message.show { display: block; }
        .message.error { background-color: #ff6b6b33; color: #ff6b6b; }
        .message.success { background-color: #22c55e33; color: #22c55e; }

        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 0.75rem;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 1rem;
        }

        .btn-primary {
            background-color: #8b5cf6;
            color: #fff;
        }

        .btn-primary:hover { background-color: #a78bfa; }

        .btn-secondary {
            background-color: transparent;
            color: #8b5cf6;
            border: 2px solid #8b5cf6;
        }

        .btn-secondary:hover { background-color: #8b5cf620; }

        /* Main App Styles */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem;
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
        }

        .user-info {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .user-name {
            color: #8b5cf6;
            font-weight: 600;
        }

        .logout-btn {
            background-color: #380056;
            color: #fff;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background-color 0.3s;
        }

        .logout-btn:hover { background-color: #5a0088; }

        .search-container {
            max-width: 600px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid #380056;
            border-radius: 2rem;
            background-color: #1a002c;
            color: #e0e0e0;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #8b5cf6;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .nav-tab {
            background-color: #380056;
            color: #fff;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .nav-tab:hover { background-color: #5a0088; }
        .nav-tab.active { background-color: #8b5cf6; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .albums-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            padding: 1rem;
        }

        .album-card {
            background-color: #380056;
            border-radius: 1rem;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .album-card:hover {
            transform: translateY(-5px);
            background-color: #5a0088;
        }

        .album-cover {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 0.75rem;
            object-fit: cover;
            margin-bottom: 1rem;
        }

        .album-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .album-info p {
            font-size: 0.85rem;
            color: #b3b3b3;
        }

        .song-list {
            list-style: none;
            padding: 0;
            max-width: 800px;
            margin: 0 auto;
        }

        .song-item {
            background-color: #380056;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }

        .song-item:hover {
            background-color: #5a0088;
            transform: translateY(-2px);
        }

        .song-item.hidden { display: none; }

        .song-main {
            display: flex;
            align-items: center;
            flex: 1;
            cursor: pointer;
        }

        .song-art {
            width: 50px;
            height: 50px;
            border-radius: 0.5rem;
            margin-right: 1rem;
            object-fit: cover;
        }

        .song-info h3 {
            margin: 0 0 0.25rem 0;
            font-size: 1rem;
            color: #ffffff;
        }

        .song-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #b3b3b3;
        }

        .playlist-btn {
            background-color: #8b5cf6;
            border: none;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .playlist-btn:hover { background-color: #a78bfa; }
        .playlist-btn.added { background-color: #22c55e; }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #a0a0a0;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #380056;
        }

        /* Player Styles */
        .player-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            padding: 4rem 1rem;
        }

        .player-box {
            background: linear-gradient(135deg, #2e004d80, #1a002c80);
            border-radius: 2rem;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .player-header {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .player-art {
            width: 80px;
            height: 80px;
            border-radius: 0.5rem;
            margin-right: 1rem;
            object-fit: cover;
        }

        .track-info h2 {
            font-size: 1.3rem;
            margin: 0 0 0.25rem 0;
            color: #ffffff;
        }

        .track-info p {
            font-size: 0.9rem;
            color: #b3b3b3;
            margin: 0;
        }

        .lyrics {
            height: 180px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1.5rem;
            line-height: 1.8;
        }

        .lyric-line {
            color: rgba(255, 255, 255, 0.4);
            transition: color 0.3s;
            display: block;
            margin-bottom: 0.3em;
        }

        .lyric-line.highlight {
            color: #ffffff;
            font-weight: 600;
        }

        .progress-container {
            background-color: #404040;
            border-radius: 5px;
            cursor: pointer;
            height: 8px;
            width: 100%;
            margin-bottom: 0.5rem;
        }

        .progress-bar {
            background-color: #8b5cf6;
            height: 100%;
            border-radius: 5px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #a0a0a0;
            margin-bottom: 1rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }

        .control-btn {
            background: none;
            border: none;
            color: #e0e0e0;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0.5rem;
        }

        .control-btn:hover {
            color: #8b5cf6;
            transform: scale(1.1);
        }

        .control-btn.play { font-size: 2.5rem; color: #8b5cf6; }
        .control-btn.active { color: #8b5cf6; }

        .secondary-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .volume-control, .speed-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        input[type="range"] {
            width: 70px;
            height: 5px;
        }

        .back-btn {
            position: fixed;
            top: 1rem;
            left: 1rem;
            background-color: #380056;
            color: #fff;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            z-index: 10;
            transition: background-color 0.3s;
        }

        .back-btn:hover { background-color: #5a0088; }

        @media (max-width: 768px) {
            header h1 { font-size: 1.8rem; }
            .user-info {
                position: static;
                justify-content: center;
                margin-top: 1rem;
            }
            .albums-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
        }
    </style>
</head>

    <div id="videoBg" class="video-bg">
        <video id="bgVideo" autoplay loop muted playsinline></video>
    </div>
    <div class="video-overlay"></div>

    <!-- Login Page -->
    <div id="loginPage" class="page active">
        <div class="login-container">
            <div class="login-box">
                <h1><i class="fas fa-music"></i> MB Music</h1>
                <div id="authMessage" class="message"></div>
                <form id="authForm">
                    <div class="form-group">
                        <label>Usuario</label>
                        <input type="text" id="authUsername" required minlength="3">
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="authPassword" required minlength="4">
                    </div>
                    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                </form>
                <button id="registerBtn" class="btn btn-secondary">Crear Cuenta Nueva</button>
            </div>
        </div>
    </div>

    <!-- Main App Page -->
    <div id="mainPage" class="page">
        <div class="app-container">
            <header>
                <h1>MiguelBR Music</h1>
                <div class="user-info">
                    <span class="user-name" id="displayUsername"></span>
                    <button class="logout-btn" id="logoutBtn">
                        <i class="fas fa-sign-out-alt"></i> Salir
                    </button>
                </div>
            </header>

            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar canciones o artistas...">
            </div>
            
            <div class="nav-tabs">
                <button class="nav-tab active" data-tab="albums">Álbumes</button>
                <button class="nav-tab" data-tab="songs">Canciones</button>
                <button class="nav-tab" data-tab="playlist">Mi Playlist</button>
            </div>

            <div id="albumsTab" class="tab-content active">
                <div id="albumsGrid" class="albums-grid"></div>
            </div>

            <div id="songsTab" class="tab-content">
                <ul id="songList" class="song-list"></ul>
            </div>

            <div id="playlistTab" class="tab-content">
                <div id="playlistContent"></div>
            </div>

            <div id="artistSongsTab" class="tab-content">
                <button id="backToAlbumsBtn" class="btn btn-secondary" style="max-width: 200px; margin: 0 auto 2rem;">
                    <i class="fas fa-arrow-left"></i> Volver a Álbumes
                </button>
                <div id="artistSongsContent"></div>
            </div>
        </div>
    </div>

    <!-- Player Page -->
    <div id="playerPage" class="page">
        <button id="backBtn" class="back-btn">
            <i class="fas fa-arrow-left"></i> Atrás
        </button>
        <div class="player-container">
            <div class="player-box">
                <div class="player-header">
                    <img id="playerArt" class="player-art" src="https://placehold.co/100" alt="Album">
                    <div class="track-info">
                        <h2 id="playerTitle">Título</h2>
                        <p id="playerArtist">Artista</p>
                    </div>
                </div>

                <div id="lyricsBox" class="lyrics"></div>

                <div class="progress-container" id="progressContainer">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>

                <div class="controls">
                    <button class="control-btn" id="prevBtn"><i class="fas fa-backward-step"></i></button>
                    <button class="control-btn play" id="playBtn"><i class="fas fa-play"></i></button>
                    <button class="control-btn" id="nextBtn"><i class="fas fa-forward-step"></i></button>
                </div>

                <div class="secondary-controls">
                    <button class="control-btn" id="repeatBtn"><i class="fas fa-repeat"></i></button>
                    <button class="control-btn" id="shuffleBtn"><i class="fas fa-shuffle"></i></button>
                    <div class="volume-control">
                        <i class="fas fa-volume-down"></i>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
                    </div>
                    <div class="speed-control">
                        <i class="fas fa-gauge"></i>
                        <input type="range" id="speedSlider" min="0.5" max="2" step="0.25" value="1">
                        <span id="speedDisplay">1x</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

                const song = SONGS[currentIndex];

        function play() {
            audio.play();
            isPlaying = true;
            document.getElementById('playBtn').innerHTML = '<i class="fas fa-pause"></i>';
        }

        function pause() {
            audio.pause();
            isPlaying = false;
            document.getElementById('playBtn').innerHTML = '<i class="fas fa-play"></i>';
        }

        function prev() {
            const maxIndex = playlistMode ? currentPlaylist.length : SONGS.length;
            currentIndex = (currentIndex - 1 + maxIndex) % maxIndex;
            loadSong();
            play();
        }

        function next() {
            const maxIndex = playlistMode ? currentPlaylist.length : SONGS.length;
            currentIndex = (currentIndex + 1) % maxIndex;
            loadSong();
            play();
        }

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                const song = playlistMode ? currentPlaylist[currentIndex] : SONGS[currentIndex];
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artists.join(', '),
                    album: song.album,
                    artwork: [{ src: song.cover, sizes: '512x512', type: 'image/jpeg' }]
                });

                navigator.mediaSession.setActionHandler('play', play);
                navigator.mediaSession.setActionHandler('pause', pause);
                navigator.mediaSession.setActionHandler('previoustrack', prev);
                navigator.mediaSession.setActionHandler('nexttrack', next);
            }
        }

        // Event Listeners
        document.getElementById('playBtn').addEventListener('click', () => {
            isPlaying ? pause() : play();
        });

        document.getElementById('prevBtn').addEventListener('click', prev);
        document.getElementById('nextBtn').addEventListener('click', next);

        document.getElementById('backBtn').addEventListener('click', () => {
            showPage('mainPage');
        });

        document.getElementById('repeatBtn').addEventListener('click', function() {
            repeatMode = (repeatMode + 1) % 3;
            this.classList.toggle('active', repeatMode > 0);
            if (repeatMode === 1) {
                this.innerHTML = '<i class="fas fa-repeat-1"></i>';
                audio.loop = true;
            } else {
                this.innerHTML = '<i class="fas fa-repeat"></i>';
                audio.loop = false;
            }
        });

        document.getElementById('shuffleBtn').addEventListener('click', function() {
            shuffle = !shuffle;
            this.classList.toggle('active', shuffle);
        });

        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        document.getElementById('speedSlider').addEventListener('input', (e) => {
            audio.playbackRate = e.target.value;
            document.getElementById('speedDisplay').textContent = e.target.value + 'x';
        });

        document.getElementById('progressContainer').addEventListener('click', (e) => {
            const width = e.currentTarget.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressBar').style.width = percent + '%';
                document.getElementById('currentTime').textContent = formatTime(audio.currentTime);

                const lines = document.querySelectorAll('.lyric-line');
                lines.forEach((line, i) => {
                    const time = parseFloat(line.dataset.time);
                    const nextTime = i < lines.length - 1 ? parseFloat(lines[i + 1].dataset.time) : Infinity;
                    
                    if (audio.currentTime >= time && audio.currentTime < nextTime) {
                        line.classList.add('highlight');
                        line.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    } else {
                        line.classList.remove('highlight');
                    }
                });
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            document.getElementById('totalTime').textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            if (repeatMode !== 1) {
                next();
            }
        });

        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                this.classList.add('active');
                const tabName = this.dataset.tab;
                document.getElementById(tabName + 'Tab').classList.add('active');
                
                if (tabName === 'playlist') {
                    renderPlaylist();
                }
            });
        });

        loadUsers();
        audio.volume = 0.8;
    </script>
</body>
</html>
